<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3f3f1">
  <meta name="description" content="A few different ways to see my world. Explore Homebody Studios, Le Index, and life lately through an interactive vintage picture viewer.">
  <title>Anna Noelle Rinke — View-Master</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip-link" href="#advance">Skip to viewer</a>
  <main class="stage" aria-label="Anna Noelle Rinke's picture viewer">
    <h1 class="identity label">Anna Noelle Rinke</h1>
    <nav class="reel-library" aria-label="Choose a reel">
      <div id="spare-reels"></div>
      <p class="choose-label label">Choose a reel</p>
    </nav>
    <section class="viewer" aria-label="View-Master">
      <div class="loaded-reel" aria-hidden="true"><div id="loaded-reel"></div></div>
      <svg class="viewer-body" viewBox="488 110 682 700" aria-hidden="true">
        <defs>
          <clipPath id="viewer-outline"><path d="M512 358 Q514 345 537 321 L570 288 Q581 278 602 280 L710 280 Q729 280 750 296 Q817 334 892 296 Q913 281 934 281 L1025 282 Q1049 282 1071 310 L1109 352 L1117 349 Q1119 327 1134 325 Q1156 325 1155 350 L1144 400 Q1140 414 1126 421 L1127 719 Q1126 740 1100 761 L1073 785 Q1057 803 1038 803 L610 803 Q586 803 566 780 L531 747 Q511 729 510 706 Z"/></clipPath>
        </defs>
        <image href="/assets/viewer-source.png" width="1672" height="941" clip-path="url(#viewer-outline)"/>
        <text id="viewer-label" display="none" x="819" y="432" text-anchor="middle">LE INDEX</text>
        <text id="viewer-frame" display="none" x="819" y="453" text-anchor="middle">02</text>
      </svg>
      <button id="advance" class="advance" aria-label="Advance to next picture" title="Next picture (right arrow)"><span class="sr-only">Next picture</span></button>
      <div class="advance-hint" aria-hidden="true"><span>click to<br>advance</span><svg viewBox="0 0 45 72"><path d="M12 3 Q39 36 16 61 M14 50 L15 63 L26 57"/></svg></div>
      <div class="controls"><button id="previous" class="previous" aria-label="Previous picture" title="Previous picture (left arrow)">←</button><p id="counter" class="counter label">02 / 20</p><button id="next" class="next" aria-label="Next picture">→</button></div>
    </section>
    <section class="selected-view" aria-label="Selected picture">
      <a id="photo-link" class="photo-mount" target="_blank" rel="noopener noreferrer"><img id="selected-image" alt="" fetchpriority="high"><div id="empty-photo" hidden><span>HOMEBODY</span><span id="empty-location"></span><small>Studio photographs coming soon</small></div></a>
      <div class="selected-copy"><h2 id="selected-title"></h2><a id="destination" class="destination label" target="_blank" rel="noopener noreferrer">Read on Substack <span aria-hidden="true">↗</span></a><p id="collection-note" class="collection-note"></p></div>
    </section>
    <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <footer><span>Three reels. A little look around.</span><a id="source-link" href="https://github.com/annanoellerinke/anna-view-master" target="_blank" rel="noopener noreferrer">Make your own ↗</a></footer>
  <script type="module" src="/app.js"></script>
</body>
</html>
